# Local run: PostgreSQL 18, migrations, the service. Dev mode: identities are not
# verified (AUTH_MODE=insecure-dev), reflection is on, logs are text.
#   make up (creates a local key and passes the host UID/GID)
#   grpcurl -plaintext -H 'x-service-authorization: Bearer dev:bank-bff' \
#     -H 'authorization: Bearer dev:<user_id>' localhost:9090 list
name: user

x-env: &env
  SERVICE_NAME: user
  ENV: dev
  AUTH_MODE: insecure-dev
  JWT_SIGNING_KEY_FILE: /run/secrets/user-signing
  JWT_KEY_ID: local
  JWT_ISSUER: local-user
  JWT_AUDIENCE: local-app
  AUTH_IDEMPOTENCY_KEY_FILE: /run/secrets/auth-idempotency
  PHONE_RESULT_KEY_FILE: /run/secrets/phone-result
  LOG_FORMAT: text
  LOG_LEVEL: debug
  DB_PRIMARY_DSN: postgres://user_service:user_service@postgres:5432/user?sslmode=disable
  PEER_BANK_STATEMENT_DATA_ADDR: ${PEER_BANK_STATEMENT_DATA_ADDR:-dns:///bank-statement-data:9090}
  PEER_ANALYTICS_ADDR: ${PEER_ANALYTICS_ADDR:-dns:///analytics:9090}
  PEER_ASSISTANT_ADDR: ${PEER_ASSISTANT_ADDR:-dns:///assistant:9090}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
      POSTGRES_DB: user
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user_service", "-d", "user"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["migrate", "up"]
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }

  user:
    build: .
    # Preserve non-root access to the host's 0600 local key.
    user: "${LOCAL_UID:-65532}:${LOCAL_GID:-65532}"
    volumes: ["./.local/jwt-signing.pem:/run/secrets/user-signing:ro", "./.local/auth-idempotency.key:/run/secrets/auth-idempotency:ro", "./.local/phone-result.key:/run/secrets/phone-result:ro"]
    command: ["serve"]
    environment: *env
    ports: ["127.0.0.1:9090:9090", "127.0.0.1:9091:9091"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
